<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>가마 온도 기록</title>
  <!-- 파일을 바꿀 때마다 ?v= 값을 올려야 아이패드가 예전 파일을 캐시에서 쓰지 않음 (js의 import 경로와 config.js의 APP_VERSION도 같이) -->
  <link rel="stylesheet" href="css/style.css?v=0.2.1">
  <script type="module" src="js/main.js?v=0.2.1"></script>
</head>
<body>
  <div class="page">
    <!-- 안내/오류 메시지 (스크롤해도 위에 보이도록 고정) -->
    <div class="sticky-stack">
      <div id="message" class="message info" role="status" aria-live="polite" hidden></div>
    </div>

    <!-- ===== 기록 화면 ===== -->
    <section id="viewRecord" class="view view-record">
      <div class="record-main">
        <section class="card">
          <div class="card-head">
            <h2>카메라</h2>
            <div class="head-actions">
              <!-- 영역 지정 모드 켜기/끄기 -->
              <button id="roiEditBtn" type="button" class="icon-btn" aria-label="영역 지정" aria-pressed="false" title="영역 지정" disabled>
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 8V4a1 1 0 0 1 1-1h4M16 3h4a1 1 0 0 1 1 1v4M21 16v4a1 1 0 0 1-1 1h-4M8 21H4a1 1 0 0 1-1-1v-4"/>
                  <rect x="7" y="9" width="10" height="6" rx="1"/>
                </svg>
              </button>
              <button id="cameraBtn" type="button" class="primary">카메라 시작</button>
            </div>
          </div>
          <div id="videoWrap" class="video-wrap">
            <video id="video" playsinline webkit-playsinline muted autoplay></video>
            <canvas id="overlay" class="readonly"></canvas>
            <div id="videoPlaceholder" class="placeholder">카메라 꺼짐</div>
          </div>
          <div class="preview-box">
            <canvas id="previewCanvas" hidden></canvas>
            <div id="previewPlaceholder" class="placeholder"></div>
          </div>
        </section>
      </div>
      <aside class="record-side">
        <!-- 가마 선택/관리 + 진행 상태 -->
        <section class="card">
          <div class="kiln-bar">
            <label for="kilnSelect" class="sr-only">현재 가마</label>
            <select id="kilnSelect"></select>
          </div>
          <div class="btn-row">
            <button id="addKilnBtn" type="button">추가</button>
            <button id="renameKilnBtn" type="button">이름 변경</button>
            <button id="deleteKilnBtn" type="button" class="danger">삭제</button>
          </div>
          <div id="nameForm" class="name-form" hidden>
            <label for="nameInput" id="nameFormLabel" class="field-label">새 가마 이름</label>
            <div class="btn-row">
              <input id="nameInput" type="text" maxlength="30" autocomplete="off" enterkeyhint="done">
              <button id="nameOkBtn" type="button" class="primary">추가</button>
              <button id="nameCancelBtn" type="button">취소</button>
            </div>
          </div>
          <div class="status-line">
            <div class="status-row">
              <span class="status-label">상태</span>
              <span id="recordState" class="state-badge">대기</span>
            </div>
            <div class="status-row">
              <span class="status-label">경과 시간</span>
              <span id="recordElapsed" class="elapsed">—</span>
            </div>
          </div>
        </section>
      </aside>

      <div class="record-extra">
        <details id="kilnSettings" class="card fold" hidden>
          <summary>가마 설정</summary>
          <label class="field">
            <span class="field-label">숫자 자릿수</span>
            <select id="digitsSelect"></select>
          </label>
          <label class="field">
            <span class="field-label">판독 주기</span>
            <select id="intervalSelect"></select>
          </label>
        </details>

        <details class="card fold">
          <summary>사용 안내</summary>
          <ul class="guide-list">
            <li>기록하는 동안 아이패드를 충전기에 연결해 두세요.</li>
            <li>설정 → 손쉬운 사용 → 사용법 유도(Guided Access)를 켜면 실수로 다른 앱으로 나가는 것을 막을 수 있습니다.</li>
            <li>Safari 공유 버튼 → "홈 화면에 추가"로 앱처럼 실행하는 것을 권장합니다.</li>
            <li>가마의 열기가 닿지 않도록 아이패드를 충분히 떨어뜨려 두세요.</li>
          </ul>
        </details>
      </div>
    </section>

    <!-- ===== 기록 보기 화면 ===== -->
    <section id="viewHistory" class="view" hidden>
      <section class="card">
        <h2>기록 보기</h2>
        <p class="muted">아직 준비 중입니다.</p>
      </section>
    </section>

    <footer><span id="appVersion"></span></footer>
  </div>

  <!-- 하단 탭 -->
  <nav class="tabbar" aria-label="화면 전환">
    <button type="button" class="tab" data-tab="record" aria-current="page">기록</button>
    <button type="button" class="tab" data-tab="history">기록 보기</button>
  </nav>
</body>
</html>
